spring:
  application:
    name: taskapp
  datasource:
    url: jdbc:h2:mem:taskapp;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.example.taskapp: INFO
